server {
    listen 80;
    listen [::]:80;
    server_name secret.krahsu.top;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name secret.krahsu.top;
    ssl_certificate /www/sites/blog.krahsu.top/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/blog.krahsu.top/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    # Vaultwarden's own CSP and security headers are preserved.
    access_log off;
    error_log /dev/stderr warn;
    client_max_body_size 128m;
    location = /admin { return 404; }
    location ^~ /admin/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:8222;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
